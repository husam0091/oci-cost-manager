name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Calendar date regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Security response leak gates
        shell: bash
        run: |
          set -euo pipefail
          # Fail on matches AND search errors (rg exit 2), pass only for no match.
          check_no_match() {
            local result=0
            rg -n -- "$1" "${@:2}" || result=$?
            [ "$result" -eq 1 ]
          }
          check_no_match '"(oci_key_content|oci_key_file|oci_pass_phrase|oci_config_file)"\s*:' api/routes
          check_no_match '-----BEGIN|PRIVATE KEY' api/routes ../frontend/src/services

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          if [ -d tests ]; then
            pytest -q --cov=. --cov-report=term --cov-report=xml:coverage.xml
          else
            echo "No tests directory found, skipping pytest."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: src/backend/coverage.xml
          if-no-files-found: ignore

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose build
        run: docker compose build
